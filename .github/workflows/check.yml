name: Check and publish game
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: bash scripts/check-game.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: game
    if: github.repository == '4onv/uwaterloo-engineering-life-play' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy game
        id: pages
        uses: actions/deploy-pages@v4
